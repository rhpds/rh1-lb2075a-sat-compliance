spec:
  title: "Red Hat Satellite Compliance"
  learning_objectives:
    - "Configure Red Hat Satellite compliance policies using OpenSCAP and SCAP Security Guide profiles"
    - "Manage RHEL host registration and content views in Red Hat Satellite"
    - "Analyze OpenSCAP compliance scan results and remediate violations using Satellite's Ansible-based remediation"
  modules:
    - id: module-01
      title: "OpenSCAP Compliance Introduction"
      duration_min: 5
      status: in_progress
    - id: module-02
      title: "Create a content view for OpenSCAP repositories"
      duration_min: 5
      status: in_progress
    - id: module-03
      title: "Create an activation key"
      duration_min: 5
      status: in_progress
    - id: module-04
      title: "Ingest and configure OpenSCAP content"
      duration_min: 7
      status: in_progress
    - id: module-05
      title: "Configure a host group"
      duration_min: 5
      status: in_progress
    - id: module-06
      title: "Create a compliance policy"
      duration_min: 5
      status: in_progress
    - id: module-07
      title: "Register hosts to the RHEL10 host group"
      duration_min: 5
      status: in_progress
    - id: module-08
      title: "Install the OpenSCAP client via Ansible roles"
      duration_min: 5
      status: in_progress
    - id: module-09
      title: "Run an OpenSCAP scan on a host"
      duration_min: 8
      status: in_progress
  environment:
    platform: "rhel-vms"               # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"             # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv                 # cnv | aws — cnv is default
    max_concurrent_users: null          # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                     # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                    # sno | multinode — only for platform = ocp
    control_plane_instance_count: null  # 1 if sno, 3 if multinode
    control_plane_cpu: null             # 32 if sno, 16 if multinode
    control_plane_ram_gb: null          # 128 if sno, 64 if multinode
    worker_count: null                  # number of OCP worker nodes
    worker_cpu: null                    # vCPU per worker
    worker_ram_gb: null                 # RAM per worker in GB
    worker_disk_gb: null                # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student:
      - role: "satellite-server"
        count: 1
        cpu: 8
        ram_gb: 32
        disk_gb: 540
        os: "RHEL (satellite-server-rhdp-1-6-19-04-09-26-v2)"
        hostname: "satellite.lab"
        notes: "Satellite 6.19 server; RHEL 10 repos pre-synced in base image; exposes port 443 via reencrypt route"
      - role: "managed-host"
        count: 1
        cpu: 1
        ram_gb: 4
        disk_gb: 40
        os: "RHEL 10 (rhel-10-1-04-15-26)"
        hostname: "rhel1.lab"
        notes: "RHEL 10 managed host; pre-deployed, not yet registered to Satellite at lab start"
      - role: "managed-host"
        count: 1
        cpu: 1
        ram_gb: 4
        disk_gb: 40
        os: "RHEL 10 (rhel-10-1-04-15-26)"
        hostname: "rhel2.lab"
        notes: "RHEL 10 managed host; pre-deployed, not yet registered to Satellite at lab start"

    # --- Common fields (both platforms) ---
    aap_version: ""                     # N/A — Ansible used via Satellite's built-in integration
    ai_requirement: "none"              # maas | gpu | none
    ai_model_tier: ""                   # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                   # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                 # all products are GA
    non_ga_access_plan: ""
    external_services:
      - "Red Hat CDN (repositories pre-synced at lab start; no active connection required during participant steps)"
    gpu_nodes: 0                        # number of GPU nodes (0 = none)
    gpu_type: ""                        # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 0.75
  audience: "intermediate"             # beginner | intermediate | advanced

