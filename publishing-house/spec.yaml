# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false  # GUI-driven steps; Satellite Web UI state not fully scriptable at intake
    assessment_strategy: "Per-module solve and validation scripts using Satellite API checks for GUI-driven steps and CLI output verification for Hammer-driven steps. Capstone module (09) validates scan completion, report visibility, and SSH empty-password remediation state."
    catalog_gap: "This lab covers the end-to-end OpenSCAP compliance workflow in Red Hat Satellite 6.19 with RHEL 10 — from content view and activation key setup through host registration, foreman_scap_client deployment, DISA STIG policy configuration with a custom tailoring file, compliance scanning, and Ansible-based remediation. Existing catalog items address Satellite basics or standalone OpenSCAP usage but do not demonstrate the integrated Satellite compliance workflow with tailoring files and automated remediation via Satellite's built-in Ansible integration."
    design_overview: "Red Hat Satellite Compliance is a 45-minute intermediate lab covering the end-to-end OpenSCAP compliance workflow in Satellite 6.19: content views, activation keys, host groups, compliance policies, host registration, OpenSCAP client deployment via Ansible, compliance scanning, and Ansible-based remediation. The lab uses two RHEL 10 managed hosts and is primarily GUI-driven with targeted Hammer CLI steps in modules 4 and 7."
    module_summaries:
      - title: "OpenSCAP Compliance Introduction"
        overview: "Introduces OpenSCAP, the SCAP framework, and Satellite's compliance integration. Participants log into the Satellite Web UI and review the full lab workflow."
      - title: "Create a content view for OpenSCAP repositories"
        overview: "Creates the RHEL10 content view in Satellite, adds RHEL 10 BaseOS/AppStream/Satellite Client 6 repos, publishes, and promotes to Library."
      - title: "Create an activation key"
        overview: "Creates the RHEL10 activation key tied to the content view and enables the Satellite Client 6 repo override for OpenSCAP client installation."
      - title: "Ingest and configure OpenSCAP content"
        overview: "Uses Hammer CLI to upload SCAP content, import the foreman_scap_client Ansible role and variables, and create a custom DISA STIG SSHD tailoring file."
      - title: "Configure a host group"
        overview: "Creates the RHEL10 host group in Satellite bundling content view, lifecycle environment, OpenSCAP capsule, Ansible role, and activation key."
      - title: "Create a compliance policy"
        overview: "Creates the 'DISA STIG no empty passwords ssh' compliance policy via the Satellite wizard with Ansible deployment, STIG profile, tailoring file, and RHEL10 host group."
      - title: "Register hosts to the RHEL10 host group"
        overview: "Generates a host registration script via Hammer and runs it over SSH to register rhel1.lab and rhel2.lab under the RHEL10 host group with Insights and Remote Execution enabled."
      - title: "Install the OpenSCAP client via Ansible roles"
        overview: "Triggers the foreman_scap_client Ansible role on managed hosts via Satellite Web UI, installing the client package, writing the config, and creating the compliance scan cron job."
      - title: "Run an OpenSCAP scan on a host"
        overview: "Capstone: triggers OpenSCAP scans on both hosts, monitors completion, views the compliance report, and remediates the empty-password SSH violation using Satellite's Ansible remediation snippet."
    rcars_overlap_pct: null
    rcars_top_matches: []
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
